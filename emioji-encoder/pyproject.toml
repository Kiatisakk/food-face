[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emocodec"
version = "0.1.0"
description = "Reversible emoji tokens for a learned VQ-VAE image codec"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10", "torch>=2.3"]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.12"]
dev = ["pytest>=8", "ruff>=0.6", "scikit-image>=0.22", "httpx>=0.27"]
train = ["tensorboard>=2.16"]

[project.scripts]
emocodec = "emocodec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emocodec = ["assets/*.json"]
